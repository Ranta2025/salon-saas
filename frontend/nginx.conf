server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

  # SPA: unknown paths are client-side routes, never a 404 from nginx.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The service worker must be revalidated so a new deploy reaches the browser.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # The entry document points at hashed assets: never cache it.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "public, max-age=300";
    try_files $uri =404;
  }

  # Fingerprinted build assets can live forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /img/ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location /icons/ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}

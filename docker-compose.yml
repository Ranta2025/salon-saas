# Salón SaaS — stack local completo.
#
#   crear el archivo de variables con JWT_SECRET (obligatorio): ver docs/ops/environment.md
#   make up                 # o: docker compose up -d --build
#
# Puertos host por defecto: web 8081, api 8080, postgres 5432, redis 6379,
# mailpit 8025 (UI) / 1025 (SMTP). Todo se puede pisar desde .env; los valores
# por defecto existen para que `docker compose config` funcione sin .env.
#
# MinIO es opcional y vive detrás del perfil `files`. La imagen por defecto es
# pgsty/minio (fork comunitario con la misma API S3); las imágenes oficiales
# minio/minio y bitnami/minio ya no se publican. Alternativas y comandos en
# docs/ops/minio.md:
#   docker compose --profile files up -d minio

services:
  api:
    build:
      context: ./backend
    environment:
      # La DB se arma con las mismas piezas que usa el servicio postgres, así
      # no hay dos fuentes de verdad para usuario/clave/base.
      DATABASE_URL: postgres://${POSTGRES_USER:-salon}:${POSTGRES_PASSWORD:-salon}@postgres:5432/${POSTGRES_DB:-salon}?sslmode=disable
      # Obligatorio a propósito: sin secreto el proceso no arranca.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://localhost:5173,http://localhost:4173}
      MEDIA_DIR: ${MEDIA_DIR:-/media}
      # Fotos en S3/MinIO: si S3_ENDPOINT queda vacío se usa el volumen local.
      # Con el perfil `files`: S3_ENDPOINT=http://minio:9000 (ver docs/ops/minio.md).
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-salon-media}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      PORT: ${PORT:-8080}
      GIN_MODE: ${GIN_MODE:-debug}
      # Email a clientes (T12). Por defecto apunta al Mailpit del stack: así
      # `docker compose up` muestra la confirmación y el recordatorio en
      # http://localhost:8025 sin configurar nada. SMTP_HOST vacío apaga los
      # correos (la API arranca igual y loguea "email deshabilitado").
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-turnos@salon.local}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_TLS: ${SMTP_TLS:-none}
      # Cada cuánto mira la cola de recordatorios (duración de Go).
      REMINDER_INTERVAL: ${REMINDER_INTERVAL:-60s}
      # Lista de espera (F7): cada cuánto se barre y se avisa. 0 la deshabilita.
      WAITLIST_INTERVAL: ${WAITLIST_INTERVAL:-60s}
      # Base pública del frontend: el enlace de la invitación de equipo se arma
      # como "<APP_URL>/invitacion#<token>" (F2g1). Con el compose, la web está
      # en WEB_PORT (8081).
      APP_URL: ${APP_URL:-http://localhost:8081}
      # Seña online (F11): el secreto del BANCO SIMULADO. Este valor es SOLO para
      # desarrollo (lo lee cualquiera que abra este archivo): en producción se
      # configura uno propio o se deja vacío para apagar las señas (NoopGateway:
      # no se pueden activar, las rutas del banco y el callback responden 404 y el
      # barrido no corre). NO USAR ESTE VALOR EN PRODUCCIÓN.
      PAYMENT_SIM_SECRET: ${PAYMENT_SIM_SECRET:-desarrollo-solo-simbank-no-produccion}
      # A dónde llama el banco simulado: por defecto, el callback de esta API
      # dentro de la red del compose (el puerto interno de la API).
      PAYMENT_CALLBACK_URL: ${PAYMENT_CALLBACK_URL:-http://api:8080/api/v1/payments/callback}
      # Cada cuánto barre las señas vencidas y las canceladas (0 lo deshabilita).
      DEPOSIT_INTERVAL: ${DEPOSIT_INTERVAL:-60s}
      # Reseñas posvisita (F13): cada cuánto se piden las reseñas de los turnos
      # atendidos (0 deshabilita la tarea; por defecto, cada 5 minutos).
      REVIEW_INTERVAL: ${REVIEW_INTERVAL:-300s}
    ports:
      - "${API_PORT:-8080}:${PORT:-8080}"
    volumes:
      # Mismo target que MEDIA_DIR: si se cambia MEDIA_DIR, usar una ruta
      # absoluta dentro del contenedor (el volumen la sigue).
      - media:${MEDIA_DIR:-/media}
    depends_on:
      postgres:
        condition: service_healthy
      # La API arranca igual si Mailpit no está: el sender queda deshabilitado.
      mailpit:
        condition: service_started
    # Permite que el API llegue a un MinIO que corre suelto en el host
    # (S3_ENDPOINT=http://host.docker.internal:9000); en Linux hay que declararlo.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Seed de DEMO (Fase 6): servicio de UNA SOLA VEZ que carga los datos con los
  # que se ven todas las pantallas. Corre solo cuando la API está sana, escribe
  # por la API real (y por SQL para lo que la API no puede crear con fecha
  # pasada) y termina: `restart: "no"` para que `docker compose up` no lo repita.
  #
  # Es SOLO para desarrollo: los tres seguros del binario son SEED_DEMO=true,
  # una base local (o SEED_FORCE=1) y nunca una migración. Todo lo que hace, los
  # logins y cómo resetearlo están en docs/ops/demo-seed.md.
  seed:
    build:
      context: ./backend
    entrypoint: ["/seed"]
    environment:
      SEED_DEMO: ${SEED_DEMO:-true}
      # La misma base que la API, con las mismas piezas que usa el servicio postgres.
      DATABASE_URL: postgres://${POSTGRES_USER:-salon}:${POSTGRES_PASSWORD:-salon}@postgres:5432/${POSTGRES_DB:-salon}?sslmode=disable
      SEED_API_URL: http://api:${PORT:-8080}
      # Las fotos viven en scripts/demo-assets (versionadas) y se montan:
      # el contexto de build de la imagen es ./backend, así que no pueden
      # hornearse sin duplicarlas dentro del repo.
      SEED_ASSETS_DIR: /assets
      SEED_FORCE: ${SEED_FORCE:-}
      SEED_RNG_SEED: ${SEED_RNG_SEED:-}
      SEED_TIMEOUT: ${SEED_TIMEOUT:-10m}
    volumes:
      - ./scripts/demo-assets:/assets:ro
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ./frontend
      args:
        # Se hornea en el build: la imagen de producción es estática (nginx :80).
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salon}
      POSTGRES_DB: ${POSTGRES_DB:-salon}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salon} -d ${POSTGRES_DB:-salon}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7}
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:latest}
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    restart: unless-stopped

  # Opcional: solo con --profile files. La imagen se elige con MINIO_IMAGE
  # (ver docs/ops/minio.md para alternativas si el pull falla).
  minio:
    image: ${MINIO_IMAGE:-pgsty/minio:latest}
    profiles: ["files"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-salon}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-salon-secret-123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media:
  miniodata:

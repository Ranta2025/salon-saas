services:
  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://salon:salon@postgres:5432/salon?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
  web:
    build: ./frontend
    ports:
      - "5173:5173"
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=salon
      - POSTGRES_PASSWORD=salon
      - POSTGRES_DB=salon
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  minio:
    image: quay.io/minio/minio
    profiles: ["files"] # opcional: archivos llegan en Fase 3; no bloquea Fase 1
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  pgdata:
